<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>B.O. sintético com painel em loading permanente</title></head>
<body>
  <h1>Boletim de Ocorrência 00000001/2026</h1>
  <div role="tablist">
    <button role="tab" aria-controls="registro">Dados do Registro</button>
    <button role="tab" aria-controls="fato">Dados do Fato</button>
    <button role="tab" aria-controls="envolvidos">Envolvidos</button>
    <button role="tab" aria-controls="vinculos">Vínculos</button>
    <button role="tab" aria-controls="objetos">Objetos</button>
    <button role="tab" aria-controls="relato">Relato/Histórico</button>
    <button role="tab" aria-controls="documentos">Documentos</button>
    <button role="tab" aria-controls="historico">Histórico</button>
    <button role="tab" aria-controls="despachos">Despachos</button>
  </div>
  <section id="registro">Registro OK.</section>
  <section id="fato">Fato OK.</section>
  <section id="envolvidos">Envolvidos OK.</section>
  <section id="vinculos">Vínculos OK.</section>
  <section id="objetos">Objetos OK.</section>
  <section id="relato">Relato OK.</section>
  <!-- Painel que NUNCA sai do estado loading: o reader precisa reportar PAINEL_NAO_CARREGADO -->
  <section id="documentos" data-state="loading">Carregando documentos...</section>
  <section id="historico">Histórico OK.</section>
  <section id="despachos">Despachos OK.</section>
</body></html>
